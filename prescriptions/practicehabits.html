<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Popular practice prescriptions: search for a GP practice and see who writes what.">
<meta name="author" content="James Irwin">
<link rel="icon" href="../../favicon.ico">
<title>Practice prescriptions | James Irwin</title>

<style>
:root {
  --bg:#f7f8f9;
  --ink:#14181c;
  --soft:#59626b;
  --rule:#d9dde1;
  --link:#0b5568;
  --tint:#eceff1;
}

@media (prefers-color-scheme:dark) {
  :root {
    --bg:#101316;
    --ink:#e6e9ec;
    --soft:#97a1aa;
    --rule:#2a3036;
    --link:#6cc3d8;
    --tint:#1a1f23;
  }
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

a {
  color:var(--link);
  text-underline-offset:.18em;
}

a:focus-visible,
button:focus-visible,
input:focus-visible {
  outline:2px solid var(--link);
  outline-offset:3px;
  border-radius:3px;
}

.wrap {
  display:grid;
  grid-template-columns:15rem minmax(0,1fr);
  gap:4rem;
  max-width:80rem;
  margin:0 auto;
  padding:4rem 1.5rem 5rem;
}

aside {
  position:sticky;
  top:4rem;
  align-self:start;
}

.name {
  display:block;
  font:600 2rem/1.15 ui-serif,Georgia,serif;
  color:var(--ink);
  text-decoration:none;
  margin-bottom:.5rem;
}

nav a {
  display:block;
  padding:.2rem 0;
  color:var(--ink);
  text-decoration:none;
}

nav a:hover {
  color:var(--link);
  text-decoration:underline;
}

.eyebrow {
  margin:0 0 .4rem;
  font-size:.8rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--soft);
}

h1 {
  font:600 2rem/1.2 ui-serif,Georgia,serif;
  margin:0 0 .5rem;
}

.lede {
  color:var(--soft);
  margin:.2rem 0 2rem;
}

section {
  border-top:1px solid var(--rule);
  padding-top:1.5rem;
}

.field,
header {
  max-width:40rem;
}

.field label {
  display:block;
  font-size:.9rem;
  color:var(--soft);
  margin-bottom:.35rem;
}

.field input {
  width:100%;
  font:inherit;
  color:var(--ink);
  background:var(--tint);
  border:1px solid var(--rule);
  border-radius:4px;
  padding:.5rem .75rem;
}

.field input:focus {
  border-color:var(--link);
}

#results {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));
  gap:2rem 1.5rem;
  margin-top:2rem;
}

.practice {
  min-height:7rem;
  font-size:.85rem;
  line-height:1.5;
  margin-bottom:.5rem;
}

.chart {
  width:100%;
  max-width:400px;
  height:350px;
}

#results > div:empty {
  display:none;
}

#results table {
  width:100%;
  border-collapse:collapse;
  font-size:.9rem;
}

#results th,
#results td {
  text-align:left;
  padding:.25rem .4rem;
  border-bottom:1px solid var(--rule);
}

.map { float:right; }

@media(max-width:780px) {
  .wrap {
    display:block;
    padding:2rem 1.25rem 4rem;
  }
  aside {
    position:static;
    margin-bottom:2rem;
  }
  nav {
    display:flex;
    gap:1.1rem;
    flex-wrap:wrap;
  }
}
</style>

<script src="https://www.gstatic.com/charts/loader.js"></script>
<script>
  google.charts.load('current', {'packages':['corechart']});
</script>

<script src="practices.json.three.years.js"></script>
<script src="bnf.to.name.js"></script>
<script src="suggest.js"></script>
</head>

<body>

<div class="wrap">

<aside>
  <a class="name" href="../index.html">James Irwin</a>
  <nav aria-label="Main navigation">
    <a href="../index.html">Home</a>
    <a href="../projects.html">Projects</a>
    <a href="medicinehub.html">Drug map</a>
    <a href="../index.html#contact">Contact</a>
  </nav>
</aside>

<main>
  <header>
    <p class="eyebrow">Prescriptions</p>
    <h1>Popular practice prescriptions</h1>
    <p class="lede">Who writes what? Search for a practice to see its most prescribed items.</p>
  </header>

  <section>
    <div class="field">
      <label for="ptext" id="pname">Practice name</label>
      <input tabindex="1" type="text" id="ptext" aria-describedby="pname" autocomplete="off">
    </div>

    <div id="results" aria-live="polite">
      <div id="P1"></div><div id="P2"></div><div id="P3"></div>
      <div id="P4"></div><div id="P5"></div><div id="P6"></div>
      <div id="P7"></div><div id="P8"></div><div id="P9"></div>
      <div id="P10"></div><div id="P11"></div><div id="P12"></div>
      <div id="P13"></div><div id="P14"></div><div id="P15"></div>
    </div>
  </section>
</main>

</div>

<script>
window.onload = function () {
  var scriberFinder = new AutoSuggestControl(
    document.getElementById("ptext"),
    [
      document.getElementById("P1"),
      document.getElementById("P2"),
      document.getElementById("P3"),
      document.getElementById("P4"),
      document.getElementById("P5"),
      document.getElementById("P6"),
      document.getElementById("P7"),
      document.getElementById("P8"),
      document.getElementById("P9")
    ],
    practices
  );

  document.getElementById("ptext").focus();
};
</script>

<!-- Kept in case suggest.js relies on jQuery; remove if it doesn't -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>

</body>
</html>
