
<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markov poetry | James Irwin</title>

<style>
:root {
  --bg:#f7f8f9;
  --ink:#14181c;
  --soft:#59626b;
  --rule:#d9dde1;
  --link:#0b5568;
  --tint:#eceff1;
}

@media (prefers-color-scheme:dark) {
  :root {
    --bg:#101316;
    --ink:#e6e9ec;
    --soft:#97a1aa;
    --rule:#2a3036;
    --link:#6cc3d8;
    --tint:#1a1f23;
  }
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

a {
  color:var(--link);
  text-underline-offset:.18em;
}

a:focus-visible,
button:focus-visible {
  outline:2px solid var(--link);
  outline-offset:3px;
  border-radius:3px;
}

.wrap {
  display:grid;
  grid-template-columns:15rem minmax(0,40rem);
  gap:4rem;
  max-width:62rem;
  margin:0 auto;
  padding:4rem 1.5rem 5rem;
}

aside {
  position:sticky;
  top:4rem;
  align-self:start;
}

.name {
  display:block;
  font:600 2rem/1.15 ui-serif,Georgia,serif;
  color:var(--ink);
  text-decoration:none;
  margin-bottom:.5rem;
}

nav a {
  display:block;
  padding:.2rem 0;
  color:var(--ink);
  text-decoration:none;
}

nav a:hover {
  color:var(--link);
  text-decoration:underline;
}

h1 {
  font:600 2rem/1.2 ui-serif,Georgia,serif;
  margin:0 0 .5rem;
}

.lede {
  color:var(--soft);
  margin:.2rem 0 2rem;
}

section {
  border-top:1px solid var(--rule);
  padding-top:1.5rem;
}

#message {
  font:1.5rem/1.5 ui-serif,Georgia,serif;
  min-height:4rem;
  margin:0 0 1.5rem;
  overflow-wrap:anywhere;
}

#buttonset {
  display:flex;
  flex-wrap:wrap;
  gap:.5rem;
}

.choice {
  font:inherit;
  font-size:.9rem;
  padding:.35rem .8rem;
  color:var(--link);
  background:transparent;
  border:1px solid var(--link);
  border-radius:4px;
  cursor:pointer;
}

.choice:hover {
  background:var(--link);
  color:var(--bg);
}

.controls {
  margin-top:1.5rem;
}

.secondary {
  color:var(--soft);
  background:transparent;
  border:1px solid var(--rule);
  border-radius:4px;
  padding:.3rem .7rem;
  font:inherit;
  font-size:.85rem;
  cursor:pointer;
}

.secondary:hover {
  border-color:var(--link);
  color:var(--link);
}

@media(max-width:780px) {
  .wrap {
    display:block;
    padding:2rem 1.25rem 4rem;
  }
  aside {
    position:static;
    margin-bottom:2rem;
  }
  nav {
    display:flex;
    gap:1.1rem;
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<div class="wrap">

<aside>
  <a class="name" href="../index.html">James Irwin</a>
  <nav aria-label="Main navigation">
    <a href="../index.html">Home</a>
    <a href="../projects.html">Projects</a>
  </nav>
</aside>

<main>
  <header>
    <h1>Markov poetry</h1>
    <p class="lede">
      A predictive text experiment using word pairs from
      Shakespeare's Romeo and Juliet.
    </p>
  </header>

  <section>
    <p class="lede">Continue the line by choosing a suggested word.</p>

    <div id="message" aria-live="polite">I was</div>

    <div id="buttonset" aria-label="Suggested next words"></div>

    <div class="controls">
      <button type="button" class="secondary" id="restart">
        Start again
      </button>
    </div>
  </section>
</main>

</div>

<script src="completed.dictionary.js"></script>

<script>
const messageElement = document.getElementById("message");
const buttonElement = document.getElementById("buttonset");
const startingPhrase = "I was";
const startingWord = "born";

function generate_suggester_buttons(word) {
  messageElement.textContent += " " + word;
  buttonElement.replaceChildren();

  const suggestions = dict[word] || [];

  suggestions.forEach(function(nextWord) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice";
    button.textContent = nextWord;

    button.addEventListener("click", function() {
      generate_suggester_buttons(nextWord);
    });

    buttonElement.appendChild(button);
  });
}

function restart() {
  messageElement.textContent = startingPhrase;
  generate_suggester_buttons(startingWord);
}

document.getElementById("restart").addEventListener("click", restart);

restart();
</script>

</body>
</html>
